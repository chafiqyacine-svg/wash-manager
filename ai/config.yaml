# Configuration du pipeline edge : caméras, zones, connexion backend.
# TODO(dev): calibrer les coordonnées (pixels) de chaque ligne/zone par caméra,
#   idéalement via un petit outil d'annotation sur une image figée du flux.

backend:
  events_url: "http://backend:8000/api/v1/events"
  api_key_env: "AI_INGEST_API_KEY"   # la clé est lue depuis l'environnement
  outbox_path: "outbox.db"           # file locale durable (aucun événement perdu)
  flush_intervalle_s: 5.0            # période de vidage de l'outbox en tâche de fond

models:
  vehicule_detector: "ai/models/yolo_vehicules.pt"   # TODO(dev): fournir les poids
  plaque_detector: "ai/models/yolo_plaques.pt"       # TODO(dev): fournir les poids
  ocr_lang: ["ar", "en"]                              # plaques marocaines

tracking:
  type: "bytetrack"   # bytetrack | deepsort
  max_age: 30

# TOPOLOGIE. Le tracker numérote les véhicules LOCALEMENT et par caméra ; le
# backend corrèle les événements d'un véhicule par sa clé de suivi (préfixée par
# la caméra). Deux montages sont possibles :
#
#   • RECOMMANDÉ (v1) — une caméra plongeante PAR BAIE (role: "bay") couvrant
#     entrée + zones + sortie. Le track_id reste stable sur tout le parcours ;
#     aucune ré-identification n'est nécessaire. Voir cam_baie1 ci-dessous.
#
#   • AVANCÉ — une caméra par STAGE (entree / zone / sortie, plus bas, en
#     commentaire). Corréler un véhicule d'une caméra à l'autre exige une
#     ré-identification inter-caméras (TODO(dev), non fournie).
cameras:
  - id: "cam_baie1"
    role: "bay"             # une baie complète : entrée + zones + sortie
    source: "rtsp://user:pass@192.168.1.10:554/stream1"  # TODO(dev)
    ligne_entree: [[100, 200], [900, 200]]   # [x1,y1],[x2,y2] — TODO(dev): calibrer
    ligne_sortie: [[100, 800], [900, 800]]
    zones:                                   # TODO(dev): calibrer chaque polygone
      - { zone_code: "B", polygone: [[100, 200], [900, 200], [900, 450], [100, 450]] }
      - { zone_code: "C", polygone: [[100, 450], [900, 450], [900, 650], [100, 650]] }
      - { zone_code: "D", polygone: [[100, 650], [900, 650], [900, 800], [100, 800]] }
    # Identification du laveur par gilet (couleur rapprochée de l'employé).
    detecter_gilet: true
    # palette_gilets est chargée automatiquement au démarrage depuis le backend
    # (GET /api/v1/events/palette-gilets, source de vérité = employés).
    # Décommenter pour la figer et ignorer le backend :
    # palette_gilets: ["#E11D48", "#2563EB", "#059669"]

  # Dupliquer le bloc ci-dessus par baie (cam_baie2, cam_baie3…), une source par
  # caméra. Les track_id ne peuvent pas entrer en collision (préfixe caméra).

  # ── Alternative « une caméra par stage » (nécessite ré-ID inter-caméras) ────
  # - id: "cam_entree"
  #   role: "entree"
  #   source: "rtsp://…"
  #   ligne_entree: [[100, 400], [900, 400]]
